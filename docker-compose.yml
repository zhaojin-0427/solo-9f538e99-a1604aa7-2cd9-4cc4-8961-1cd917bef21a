services:
  snp-check:
    build: .
    image: snp-fingerprint-check:latest
    container_name: snp-fingerprint-check
    ports:
      - "8000:8000"
    environment:
      APP_DB_PATH: /app/data/snp.db
      APP_SECRET_KEY: change-me-in-production
    volumes:
      - snp_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  snp_data:
